<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login POS - Kasir Toko</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="glass-card login-card">
            <div class="login-logo">
                <i class="fas fa-cash-register"></i>
            </div>
            <h2>POS System</h2>
            <p class="mb-3" style="opacity: 0.8; font-size: 0.9rem;">Sistem Kasir Toko Modern</p>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group text-left" style="text-align: left;">
                    <label>Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Masukkan username" required>
                </div>
                
                <div class="form-group text-left" style="text-align: left;">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
                </div>
                
                <button type="submit" class="btn btn-primary mt-2" style="width: 100%;">Login Kasir</button>
                <p style="margin-top: 1.5rem; font-size: 0.8rem; opacity: 0.7;">Gunakan <b>admin</b> / <b>admin123</b></p>
            </form>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
